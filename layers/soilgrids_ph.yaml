# Phase 0 probe layer for the A2 (COG) adapter — plan M0.3.
# Endpoint: ISRIC's 5000 m aggregated COG for v1 (single file, browser-rangeable);
# the 250 m native product is a VRT over tiled COGs and needs the materializer
# or per-tile resolution — revisit after Phase 0.
# Status: pending live verification via the verify-layer workflow (§13).
id: soilgrids_ph
name: Soil pH (0–5 cm)
domain: subsurface
adapter: cog
endpoint: https://files.isric.org/soilgrids/latest/data_aggregated/5000m/phh2o/phh2o_0-5cm_mean_5000.tif
crs: EPSG:152160
modes: [point, tile, overlay]
zoom_valid: [6, 14]
value_type: numeric
aggregation:
  primary: mean
  secondary: [min, max, p10, p90]
unit: pH
native_unit: "pH*10"
scale_factor: 0.1
nodata: -32768
ttl: 30d
rate_limit:
  max_concurrent: 4
  min_interval_ms: 0
licence: CC-BY-4.0
commercial_use: true
attribution: "ISRIC — World Soil Information, SoilGrids"
attribution_url: https://soilgrids.org
overlay:
  kind: raster
  tiles:
    - "https://maps.isric.org/mapserv?map=/map/phh2o.map&SERVICE=WMS&VERSION=1.1.1&REQUEST=GetMap&LAYERS=phh2o_0-5cm_mean&STYLES=&FORMAT=image/png&TRANSPARENT=TRUE&SRS=EPSG:3857&WIDTH=256&HEIGHT=256&BBOX={bbox-epsg-3857}"
  tile_size: 256
  min_zoom: 2
  max_zoom: 14
  opacity: 0.65
  legend:
    title: pH in water
    items:
      - { label: "3.5 — strongly acidic", color: "#f4f51e" }
      - { label: "5.0 — acidic", color: "#d8ef2a" }
      - { label: "6.0 — slightly acidic", color: "#73ce45" }
      - { label: "7.0 — neutral", color: "#25a83d" }
      - { label: "8.0 — alkaline", color: "#2ab8a6" }
      - { label: "9.2 — strongly alkaline", color: "#16c5d4" }
# Note: central Vienna is nodata at 5 km (urban mask) — a soil layer's canary
# must stand on soil. Marchfeld farmland NE of Vienna:
health_assertion:
  at: [16.75, 48.30]
  expect_range: [5.0, 9.0]
coverage: global
provenance_note: "Machine-learning model prediction (not measurement), 5 km aggregated from the 250 m SoilGrids 2.0 product"
