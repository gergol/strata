# Phase 0 probe layer for the A1 (bbox vector / Overpass) adapter — plan M0.4.
id: osm_drinking_water
name: Drinking water points
domain: built
adapter: bbox_vector
endpoint: https://overpass-api.de/api/interpreter
crs: EPSG:4326
modes: [point, tile]
zoom_valid: [12, 19]
value_type: feature
aggregation:
  primary: count
  secondary: [feature_list]
ttl: 7d
rate_limit:
  max_concurrent: 1
  min_interval_ms: 1000
licence: ODbL-1.0
commercial_use: true
attribution: "© OpenStreetMap contributors"
attribution_url: https://www.openstreetmap.org/copyright
health_assertion:
  at: [16.3725, 48.2082]   # Stephansplatz, Vienna
  expect_min_count: 1
coverage: global
provenance_note: "Crowdsourced OpenStreetMap data via Overpass; completeness varies by region"
params:
  overpass_query: "node[amenity=drinking_water]{{spatial}};"
  point_radius_m: 500
  feature_cap: 200
