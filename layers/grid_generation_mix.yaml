# Phase 0 probe layer for the A3 (region lookup) adapter — plan M0.5.
# Energy-Charts does not allow the Pages origin via CORS. The Pages workflow
# therefore validates and materializes its native response as a same-origin
# asset; adding zones remains configuration plus a materialized output.
id: grid_generation_mix
name: Electricity generation mix
domain: energy
adapter: region
endpoint: https://gergol.github.io/strata/data/grid_generation_mix-{{region}}.json
crs: EPSG:4326
modes: [point, tile]
zoom_valid: [4, 18]
value_type: categorical
aggregation:
  primary: histogram
ttl: 15m
rate_limit:
  max_concurrent: 2
  min_interval_ms: 500
licence: "CC-BY-4.0 (Energy-Charts; underlying data ENTSO-E/SMARD)"
commercial_use: false
attribution: "Energy-Charts (Fraunhofer ISE)"
attribution_url: https://www.energy-charts.info
health_assertion:
  at: [14.5, 47.5]          # rural Styria, well inside the AT polygon
  expect_status: ok
coverage:
  regions: [at]
provenance_note: "Hourly materialized public net electricity generation for the bidding zone, sourced from Energy-Charts (Fraunhofer ISE) aggregating official ENTSO-E/SMARD data; source timestamp is shown; shares are generation, not consumption"
browser_access: materialized
params:
  regions_url: https://raw.githubusercontent.com/gergol/strata/main/regions/bidding-zones.json
  format: energy_charts_public_power
  materialize_source_endpoint: https://api.energy-charts.info/public_power?country={{region}}
  materialize_regions: [at]
  # Avoid the provider's empty implicit current-day window around local midnight.
  materialize_lookback_hours: 12
  max_source_age_ms: 21600000
  max_materialized_age_ms: 7200000
