# M1.2 curated OpenStreetMap POI pack. Shared fields live in `defaults`; adding
# another standard POI is one compact entry under `layers`. Every query is
# spatially bounded and all entries share one provider-level limiter/circuit.
defaults:
  adapter: bbox_vector
  endpoint: https://overpass-api.de/api/interpreter
  crs: EPSG:4326
  modes: [point, tile]
  zoom_valid: [12, 19]
  value_type: feature
  aggregation:
    primary: count
    secondary: [feature_list]
  ttl: 7d
  rate_limit:
    group: overpass-api-de
    max_concurrent: 1
    min_interval_ms: 1000
  licence: ODbL-1.0
  commercial_use: true
  attribution: "© OpenStreetMap contributors"
  attribution_url: https://www.openstreetmap.org/copyright
  coverage: global
  provenance_note: "Crowdsourced OpenStreetMap data via Overpass; completeness and tagging vary by region"
  browser_access: direct
  search_beyond_tile: true
  params:
    point_radius_m: 300
    feature_cap: 100

layers:
  - id: osm_drinking_water
    name: Drinking water points
    domain: built
    health_assertion: { at: [16.470141, 48.190961], expect_min_count: 1 }
    params:
      overpass_query: "nwr[amenity=drinking_water]{{spatial}};"

  - id: osm_defibrillators
    name: Defibrillators (AEDs)
    domain: society
    health_assertion: { at: [16.3424919, 48.1672672], expect_min_count: 1 }
