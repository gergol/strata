name: ci
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install PMTiles derivation tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes tippecanoe
      - run: npm run typecheck
      - run: npm test
      - run: npm run derive:smoke
      - run: npm run build -w @strata/client
      - run: npm run bundle:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
