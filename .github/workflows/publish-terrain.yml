name: verify-terrain
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terrain-publication

jobs:
  rebuild-and-compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Build and validate deterministic COG
        run: bash derive/vienna-surface-cog.sh /tmp/vienna-35_4-dom-2m.cog.tif
      - name: Require bit-identical committed Pages artifact and provenance
        run: |
          actual="$(sha256sum /tmp/vienna-35_4-dom-2m.cog.tif | cut -d' ' -f1)"
          expected="$(jq -r .output.sha256 data/provenance/vienna-35_4-dom-2m.cog.json)"
          test "$actual" = "$expected"
          cmp /tmp/vienna-35_4-dom-2m.cog.tif packages/client/public/data/derived/vienna-35_4-dom-2m.cog.tif
