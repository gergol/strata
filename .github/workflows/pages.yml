name: pages
on:
  push:
    branches: [main]
  schedule:
    # Refresh browser-safe materializations without creating data commits.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Stable build numbering counts non-health commits and therefore
          # needs repository history, not checkout's single-commit default.
          fetch-depth: 0
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: build-info
        name: Resolve stable functional build identity
        run: |
          code_sha=$(git log --invert-grep --grep='^health:' -1 --format=%H)
          code_date=$(git show -s --format=%cI "$code_sha")
          code_number=$(git log --invert-grep --grep='^health:' --format=%H | wc -l | tr -d ' ')
          echo "sha=$code_sha" >> "$GITHUB_OUTPUT"
          echo "date=$code_date" >> "$GITHUB_OUTPUT"
          echo "number=$code_number" >> "$GITHUB_OUTPUT"
      - run: npm run materialize
      - run: npm run build -w @strata/client
        env:
          STRATA_BASE: /strata/
          STRATA_BUILD_SHA: ${{ steps.build-info.outputs.sha }}
          STRATA_BUILD_DATE: ${{ steps.build-info.outputs.date }}
          STRATA_BUILD_NUMBER: ${{ steps.build-info.outputs.number }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wait for the materialized asset
        run: curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 https://gergol.github.io/strata/data/grid_generation_mix-at.json --output /dev/null
      - name: Verify live layers with bounded transient retries
        run: |
          for attempt in 1 2 3; do
            if npx tsx packages/runner/src/verify.ts verify layers/*.yaml; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          exit 1
